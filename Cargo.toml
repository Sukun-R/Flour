[package]
name = "note"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
wgpu = "29.0.1"
pollster = "0.3"
bytemuck = {version = "1.24", features = ["derive"]}

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]


[lib]
name = "note"
path = "src/lib.rs" # Or "lib.rs" if it's in the root
crate-type = ["cdylib", "rlib"]